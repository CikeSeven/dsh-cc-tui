name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DSH_TUI_LANG: zh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify generated output is not checked in
        run: test -z "$(git ls-files -- lib)"

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile

      - name: Verify clean compile output
        run: |
          test -f lib/types/index.js
          test -f lib/types/dsh-adapter/invariant.js

      - run: pnpm verify:build
      - run: pnpm verify:package
      - run: pnpm smoke

      # Bounded live v2 benchmark smoke; the public command defaults to the
      # complete v2 fixture set and remains available for release measurements.
      - name: Run bounded v2 benchmark
        run: pnpm bench:tui-v2 -- --fixture v2-stream-200 --iterations 20 --output "$RUNNER_TEMP/tui-v2/bench.json"

      - name: Run v2 regression selection
        run: pnpm test:tui-v2 -- --test-name-pattern 'baseline|compare|v2-only|controller|replay|adapter|fullscreen|compositor|scroll|width|inline'

      - name: Verify v2 checks
        run: |
          for check in baseline regression-matrix trace fork skeleton controllers fullscreen inline host-capabilities v2-only; do
            pnpm verify:tui-v2 -- --check "$check" --output "$RUNNER_TEMP/tui-v2/$check.json"
          done

      # Renderer-neutral domain gates stay live. Plugin-spec/preset batteries are
      # already included by verify:build; these cover the remaining standalone
      # channel/session/config/host helpers without mounting the legacy UI.
      - name: Run renderer-neutral domain gates
        run: |
          node --import tsx/esm scripts/verify-plugin-negotiation.ts
          node scripts/verify-update.mjs
          node scripts/verify-launcher.mjs
          node scripts/verify-clipboard.mjs
          node --import tsx/esm scripts/verify-clipboard-image.ts
          node scripts/verify-legacy-rename.mjs
          node scripts/verify-cordis-approval.mjs
          node scripts/verify-working-activity.mjs
          node scripts/verify-workspace-attachment.mjs
          node scripts/verify-workspaces-degrade.mjs
          node scripts/verify-session-kinds.mjs
          node scripts/verify-session-index.mjs
          node scripts/verify-session-cwd.mjs
          node scripts/verify-session-titles.mjs
          node scripts/verify-resume-legacy-events.mjs
          node scripts/verify-file-completion.mjs
          node scripts/verify-resume-manage.mjs
          node scripts/verify-resume-rename-mru.mjs
          node --import tsx/esm scripts/verify-submit.mjs
          node --import tsx/esm scripts/verify-channel-goal-todo.mjs
          node scripts/verify-empty-assistant-row.mjs
          node scripts/verify-skill-commands.mjs
          node scripts/verify-trace-projection.mjs
          node --import tsx/esm scripts/repro-effort.tsx
          node --import tsx/esm scripts/verify-subagent-model-route.tsx
          node scripts/verify-model-route.mjs
          node --import tsx/esm scripts/verify-themes.mjs
          node scripts/verify-provider-wizard.mjs
          node scripts/verify-external-editor.mjs

      - name: Upload build v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-v2-build
          path: ${{ runner.temp }}/tui-v2
          if-no-files-found: warn

  tui-v2:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile
      - run: pnpm verify:build
      - run: pnpm verify:package
      - run: pnpm test:tui-v2 -- --output "$RUNNER_TEMP/tui-v2/test.json"

      - name: Check v2 baseline
        run: pnpm verify:tui-v2 -- --check baseline --output "$RUNNER_TEMP/tui-v2/baseline.json"
      - name: Check v2 regression matrix
        run: pnpm verify:tui-v2 -- --check regression-matrix --output "$RUNNER_TEMP/tui-v2/regression-matrix.json"
      - name: Check v2 trace replay
        run: pnpm verify:tui-v2 -- --check trace --output "$RUNNER_TEMP/tui-v2/trace.json"
      - name: Check v2 fork boundary
        run: pnpm verify:tui-v2 -- --check fork --output "$RUNNER_TEMP/tui-v2/fork.json"
      - name: Check v2 skeleton lifecycle
        run: pnpm verify:tui-v2 -- --check skeleton --output "$RUNNER_TEMP/tui-v2/skeleton.json"
      - name: Check v2 controllers
        run: pnpm verify:tui-v2 -- --check controllers --output "$RUNNER_TEMP/tui-v2/controllers.json"
      - name: Check v2 fullscreen
        run: pnpm verify:tui-v2 -- --check fullscreen --output "$RUNNER_TEMP/tui-v2/fullscreen.json"
      - name: Check v2 inline
        run: pnpm verify:tui-v2 -- --check inline --output "$RUNNER_TEMP/tui-v2/inline.json"
      - name: Check v2 host capabilities
        run: pnpm verify:tui-v2 -- --check host-capabilities --output "$RUNNER_TEMP/tui-v2/host-capabilities.json"
      - name: Check v2-only boundary
        run: pnpm verify:tui-v2 -- --check v2-only --output "$RUNNER_TEMP/tui-v2/v2-only.json"

      - name: Upload tui-v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tui-v2-node-${{ matrix.node }}
          path: ${{ runner.temp }}/tui-v2
          if-no-files-found: warn
