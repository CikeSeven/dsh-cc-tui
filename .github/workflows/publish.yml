name: Publish

# 发版入口：推送 v* 标签。构建、package surface 和 v2 checks 必须先通过。
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

env:
  DSH_TUI_LANG: zh

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm compile

      - name: Verify clean compile output
        run: |
          test -f lib/types/index.js
          test -f lib/types/dsh-adapter/invariant.js

      - run: pnpm verify:build
      - run: pnpm verify:package
      - run: pnpm smoke
      - run: pnpm test:tui-v2

      - name: Verify v2 release checks
        run: |
          for check in baseline regression-matrix trace fork skeleton controllers fullscreen inline host-capabilities v2-only; do
            pnpm verify:tui-v2 -- --check "$check" --output "$RUNNER_TEMP/tui-v2/$check.json"
          done

      - name: Run required domain gates
        run: |
          node scripts/verify-session-kinds.mjs
          node scripts/verify-session-index.mjs
          node scripts/verify-session-cwd.mjs
          node scripts/verify-session-titles.mjs
          node scripts/verify-model-route.mjs
          node scripts/verify-external-editor.mjs

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }

      # 用 npm 发布 workspace bundledDependencies；上面的 package gate 已经
      # 在同一编译产物上验证入口和离线 baseline 排除规则。
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
